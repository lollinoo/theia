# Woodpecker repository settings required by this workflow:
# - Pipeline path: leave empty for default discovery, or set it to .woodpecker/
# - Trusted Volumes: enabled for /var/run/docker.sock, /tmp/theia-managed-ci, and /var/cache/theia-ci/ mounts.
# - require_approval: forks (or stricter) — Woodpecker grants trusted volumes to PRs, which run their own YAML.
# - Secrets: restrict GHCR_USERNAME, GHCR_TOKEN, and GITHUB_TOKEN to push and release events only.
# - cancel_previous_pipeline_events: [push, pull_request] (newer PR/branch run supersedes older one; releases never cancel).
# - GitHub webhook: subscribe to the release event (Woodpecker activation/repair does not add it automatically).
#   Note: Woodpecker starts release pipelines only on GitHub's `released` action (prereleases do not run).
when:
  - event: pull_request
    branch: master
  - event: push
    branch: master
  - event: [release, manual]

services:
  - name: postgres
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: theia
      POSTGRES_PASSWORD: theia
      POSTGRES_DB: theia
  - name: postgres-e2e
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: theia
      POSTGRES_PASSWORD: theia
      POSTGRES_DB: theia

steps:
  - name: changes
    image: alpine:3.24
    commands:
      - apk add --no-cache bash jq
      - bash scripts/ci/selftest.sh
      - |
        set -eu
        mkdir -p .ci
        case "$CI_PIPELINE_EVENT" in
          manual|release)
            bash scripts/ci/changes.sh --all > .ci/changed-areas.env
            ;;
          *)
            if [ -z "$${CI_PIPELINE_FILES:-}" ]; then
              bash scripts/ci/changes.sh --all > .ci/changed-areas.env
            else
              bash -euo pipefail -c 'printf "%s" "$CI_PIPELINE_FILES" | jq -r ".[]" | bash scripts/ci/changes.sh' > .ci/changed-areas.env
            fi
            ;;
        esac
        cat .ci/changed-areas.env

  - name: backend-fast
    image: golang:1.27.4-bookworm
    depends_on:
      - changes
    environment:
      CGO_ENABLED: "1"
      GOMODCACHE: /var/cache/theia-ci/gomod
      GOCACHE: /var/cache/theia-ci/gobuild
      THEIA_TEST_DB_DSN: postgres://theia:theia@postgres:5432/theia?sslmode=disable
    volumes:
      - /var/cache/theia-ci/gomod:/var/cache/theia-ci/gomod
      - /var/cache/theia-ci/gobuild:/var/cache/theia-ci/gobuild
    commands:
      - |
        set -eu
        . .ci/changed-areas.env
        if [ "$backend" != "true" ]; then
          echo "No backend changes detected."
          exit 0
        fi
        bash scripts/ci/backend-fast.sh

  - name: frontend-fast
    image: node:26-bookworm
    depends_on:
      - changes
    environment:
      npm_config_cache: /var/cache/theia-ci/npm
    volumes:
      - /var/cache/theia-ci/npm:/var/cache/theia-ci/npm
    commands:
      - |
        set -eu
        . .ci/changed-areas.env
        if [ "$frontend" != "true" ]; then
          echo "No frontend changes detected."
          exit 0
        fi
        make frontend-fast

  - name: browser-e2e
    image: node:26-bookworm
    depends_on:
      - changes
    environment:
      GOMODCACHE: /var/cache/theia-ci/gomod
      GOCACHE: /var/cache/theia-ci/gobuild
      npm_config_cache: /var/cache/theia-ci/npm
      PLAYWRIGHT_BROWSERS_PATH: /var/cache/theia-ci/playwright
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      THEIA_E2E_DB_DSN: postgres://theia:theia@postgres-e2e:5432/theia?sslmode=disable
    volumes:
      - /var/cache/theia-ci/gomod:/var/cache/theia-ci/gomod
      - /var/cache/theia-ci/gobuild:/var/cache/theia-ci/gobuild
      - /var/cache/theia-ci/npm:/var/cache/theia-ci/npm
      - /var/cache/theia-ci/playwright:/var/cache/theia-ci/playwright
      - /var/cache/theia-ci/godl:/var/cache/theia-ci/godl
    commands:
      - |
        set -eu
        . .ci/changed-areas.env
        if [ "$integration" != "true" ]; then
          echo "No browser E2E changes detected."
          exit 0
        fi

        go_version=$(sed -n -E 's/^toolchain[[:space:]]+go([0-9]+\.[0-9]+(\.[0-9]+)?)[[:space:]]*$/\1/p' go.mod | head -n 1)
        test -n "$go_version"
        arch=$(dpkg --print-architecture)

        # node:bookworm already ships curl, git and CA certificates; the Go tarball is cached per version.
        go_tar="/var/cache/theia-ci/godl/go$go_version.linux-$arch.tar.gz"
        if [ ! -f "$go_tar" ]; then
          go_tmp=$(mktemp "$go_tar.XXXXXX")
          curl -fsSL "https://go.dev/dl/go$go_version.linux-$arch.tar.gz" -o "$go_tmp"
          mv "$go_tmp" "$go_tar"
        fi
        rm -rf /usr/local/go
        tar -C /usr/local -xzf "$go_tar" || { rm -f "$go_tar"; exit 1; }
        export PATH="/usr/local/go/bin:$PATH"

        # Run in an isolated tracked-files copy so parallel frontend-fast cannot race on frontend/node_modules.
        e2e_work=/tmp/theia-browser-e2e
        rm -rf "$e2e_work"
        mkdir -p "$e2e_work"
        git -c safe.directory="$PWD" ls-files -z | tar --null -T - -cf - | tar -C "$e2e_work" -xf -
        cd "$e2e_work"
        bash scripts/ci/browser-e2e.sh

  - name: deployment-integration
    image: docker:29-cli
    depends_on:
      - changes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/theia-managed-ci:/tmp/theia-managed-ci
    commands:
      - |
        set -eu
        . .ci/changed-areas.env
        if [ "$integration" != "true" ]; then
          echo "No managed deployment changes detected."
          exit 0
        fi
        apk add --no-cache bash git tar util-linux
        bash scripts/test-managed-ci.sh

  - name: publish-master-images
    image: docker:29-cli
    depends_on:
      - backend-fast
      - frontend-fast
      - browser-e2e
      - deployment-integration
    when:
      - event: push
        branch: master
    environment:
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache bash
      - |
        set -eu
        export IMAGE_SOURCE="$CI_REPO_URL"
        export IMAGE_REVISION="$CI_COMMIT_SHA"
        bash scripts/ci/publish-images.sh linux/amd64 master

  - name: publish-release-images
    image: docker:29-cli
    depends_on:
      - backend-fast
      - frontend-fast
      - browser-e2e
      - deployment-integration
    when:
      - event: release
    environment:
      GHCR_USERNAME:
        from_secret: GHCR_USERNAME
      GHCR_TOKEN:
        from_secret: GHCR_TOKEN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache bash
      - |
        set -eu
        export IMAGE_SOURCE="$CI_REPO_URL"
        export IMAGE_REVISION="$CI_COMMIT_SHA"
        bash scripts/ci/publish-images.sh linux/amd64,linux/arm64 "$CI_COMMIT_TAG" latest

  - name: release-assets
    image: golang:1.27.4-bookworm
    depends_on:
      - backend-fast
      - frontend-fast
      - browser-e2e
      - deployment-integration
      - publish-release-images
    when:
      - event: release
    environment:
      GH_TOKEN:
        from_secret: GITHUB_TOKEN
      GOMODCACHE: /var/cache/theia-ci/gomod
      GOCACHE: /var/cache/theia-ci/gobuild
    volumes:
      - /var/cache/theia-ci/gomod:/var/cache/theia-ci/gomod
      - /var/cache/theia-ci/gobuild:/var/cache/theia-ci/gobuild
    commands:
      - |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
        apt-get update
        apt-get install -y --no-install-recommends gh

        export GH_REPO="$CI_REPO"
        bash scripts/ci/release-assets.sh "$CI_COMMIT_TAG"
