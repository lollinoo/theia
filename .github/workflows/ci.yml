name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test CI scripts
        run: bash scripts/ci/selftest.sh

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch|release)
              bash scripts/ci/changes.sh --all >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              if [[ -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]] && git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null && git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
                git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | bash scripts/ci/changes.sh >> "$GITHUB_OUTPUT"
              else
                bash scripts/ci/changes.sh --all >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                bash scripts/ci/changes.sh --all >> "$GITHUB_OUTPUT"
              else
                git diff --name-only "$PUSH_BEFORE_SHA" "$COMMIT_SHA" | bash scripts/ci/changes.sh >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  backend-fast:
    name: backend-fast
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: theia
          POSTGRES_PASSWORD: theia
          POSTGRES_DB: theia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theia -d theia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CGO_ENABLED: 1
      THEIA_TEST_DB_DSN: postgres://theia:theia@127.0.0.1:5432/theia?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run backend-fast gate
        run: bash scripts/ci/backend-fast.sh

  frontend-fast:
    name: frontend-fast
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend-fast gate
        run: make frontend-fast

  browser-e2e:
    name: browser-e2e
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: theia
          POSTGRES_PASSWORD: theia
          POSTGRES_DB: theia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theia -d theia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      THEIA_E2E_DB_DSN: postgres://theia:theia@127.0.0.1:5432/theia?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run browser-e2e gate
        run: bash scripts/ci/browser-e2e.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  deployment-integration:
    name: deployment-integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run managed deployment integration
        run: sudo -E bash scripts/test-managed-ci.sh

  publish-master-images:
    name: publish-master-images
    needs: [changes, backend-fast, frontend-fast, browser-e2e, deployment-integration]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish master images
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
        run: bash scripts/ci/publish-images.sh linux/amd64 master

  publish-release-images:
    name: publish-release-images
    needs: [changes, backend-fast, frontend-fast, browser-e2e, deployment-integration]
    if: ${{ always() && !cancelled() && github.event_name == 'release' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish release images
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/ci/publish-images.sh linux/amd64,linux/arm64 "$RELEASE_TAG" latest

  release-assets:
    name: release-assets
    needs: [changes, backend-fast, frontend-fast, browser-e2e, deployment-integration, publish-release-images]
    if: ${{ always() && !cancelled() && github.event_name == 'release' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/ci/release-assets.sh "$RELEASE_TAG"

  release-assets-darwin:
    # GHA-only exception: Woodpecker has no macOS agent and fyne.io/systray needs CGO.
    name: release-assets-darwin (${{ matrix.goarch }})
    needs: [changes, backend-fast, frontend-fast, browser-e2e, deployment-integration]
    if: ${{ always() && !cancelled() && github.event_name == 'release' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and upload macOS bridge binary
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          out="bridge_binaries/winbox-bridge-darwin-${GOARCH}"
          mkdir -p bridge_binaries
          go build -ldflags="-s -w" -o "$out" ./cmd/winbox-bridge/
          gh release upload "$RELEASE_TAG" "$out" --clobber
