<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theia maintenance</title><link rel="icon" href="/branding/theia-icon.png"><style>body{font:18px system-ui;background:#10151d;color:#e9edf3;display:grid;place-items:center;min-height:90vh;margin:0}main{max-width:550px;padding:32px}h1{font-size:28px}p{line-height:1.5}#phase{color:#b3bed0}</style></head><body><main><h1>Theia is undergoing maintenance</h1><p>Application writes are paused while the instance is being verified. This page will refresh automatically.</p><p id="phase" role="status">Checking operation status…</p></main><script>async function refresh(){try{const response=await fetch('/maintenance/status',{cache:'no-store'});if(response.ok){const status=await response.json();document.getElementById('phase').textContent=`${status.action}: ${status.phase.replaceAll('_',' ')}`;if(!status.maintenance){const ready=await fetch('/readyz',{cache:'no-store'});if(ready.ok)location.replace('/');}}}catch{document.getElementById('phase').textContent='Waiting for the instance to return.';}}refresh();setInterval(refresh,5000);</script></body></html>
